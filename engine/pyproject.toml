[project]
name = "agentgate-engine"
version = "0.1.0"
description = "Verification and code analysis engine for AgentGate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.19",
    "redis>=5.0.4",
    "rq>=1.16.2",
    "docker>=7.1.0",
    "semgrep>=1.75.0",
    "radon>=6.0.1",
    "networkx>=3.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.1",
    "respx>=0.21.1",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "types-redis>=4.6.0.20240425",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --durations=5"
markers = [
    "live_llm: tests that call live external LLM APIs (excluded from CI by default)",
    "sandbox: tests that require local Docker daemon"
]
