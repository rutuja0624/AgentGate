name: CI

on:
  push:
    branches: [main, "lane/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (Lint, Type Check & Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentgate
          POSTGRES_USER: agentgate
          POSTGRES_PASSWORD: agentgate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv venv engine/.venv
          uv pip install -p engine/.venv -e "engine[dev]"

      - name: Run Ruff Lint
        run: engine/.venv/bin/ruff check engine/

      - name: Run Mypy Type Check
        run: engine/.venv/bin/mypy engine/app

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: postgresql+psycopg://agentgate:agentgate@localhost:5432/agentgate
          REDIS_URL: redis://localhost:6379/0
          LLM_PROVIDER: fake
        run: |
          engine/.venv/bin/pytest --cov=engine/app --cov-report=term-missing engine/tests

  gateway:
    name: Gateway (Spring Boot Verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper Executable
        run: chmod +x gateway/mvnw || true

      - name: Build and Test with Maven
        working-directory: gateway
        run: ./mvnw -B verify

  dashboard:
    name: Dashboard (Lint, Type Check & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Type check
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: dashboard
        run: npm test -- --run

      - name: Build production bundle
        working-directory: dashboard
        run: npm run build
